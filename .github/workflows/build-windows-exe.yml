name: Build Windows Executable

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r webapp/requirements.txt -r webapp/requirements-desktop.txt

      - name: Build executable
        shell: pwsh
        run: ./packaging/build_exe.ps1

      - name: Verify build output
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/VideoDownloader.exe")) { throw "Build did not produce VideoDownloader.exe" }

      - uses: actions/upload-artifact@v4
        with:
          name: VideoDownloader-windows
          path: dist/VideoDownloader.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (gh release view "${{ github.ref_name }}" 2>$null) {
            gh release upload "${{ github.ref_name }}" "dist/VideoDownloader.exe" --clobber
          } else {
            gh release create "${{ github.ref_name }}" "dist/VideoDownloader.exe" --title "${{ github.ref_name }}" --generate-notes
          }
