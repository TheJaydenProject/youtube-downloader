<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Downloader</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="page">
    <header class="masthead">
      <span class="tally-light" aria-hidden="true"></span>
      <div>
        <h1>Video Downloader</h1>
        <p class="subtitle">Paste a link, capture the file.</p>
      </div>
    </header>

    <div class="card">
      <form id="download-form">
        <span class="field-label">Source URL</span>
        <div id="url-rows"></div>

        <button type="button" id="add-row-btn" class="add-row-btn">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          Add another link
        </button>

        <span class="field-label">Format</span>
        <div class="select-wrap">
          <select id="format-select" name="format">
            <optgroup label="Video">
              <option value="mp4" selected>MP4 &middot; best quality</option>
              <option value="webm">WebM</option>
              <option value="mkv">MKV</option>
            </optgroup>
            <optgroup label="Audio only">
              <option value="mp3">MP3</option>
              <option value="wav">WAV</option>
              <option value="m4a">M4A / AAC</option>
            </optgroup>
          </select>
          <svg class="icon select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </div>

        <button type="submit" class="primary-btn">
          <span class="rec-dot" aria-hidden="true"></span>
          Download
        </button>
      </form>

      <div id="progress-container" class="hidden">
        <p id="queue-position" class="queue-position"></p>
        <p id="current-title" class="current-title"></p>
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <p id="status-text" class="status-text">Starting&hellip;</p>
      </div>

      <div id="completed-list" class="hidden"></div>

      <div id="result" class="hidden">
        <button type="button" id="another-btn" class="primary-btn">Download another</button>
      </div>

      <div id="error" class="hidden error-msg">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4m0 4h.01M10.3 3.86 1.82 18a1 1 0 0 0 .86 1.5h18.64a1 1 0 0 0 .86-1.5L13.7 3.86a1 1 0 0 0-1.72 0Z"/></svg>
        <span id="error-text"></span>
      </div>
    </div>

    <p class="footnote">Files are saved to <code>downloads/</code> on your machine</p>
  </main>

  <template id="url-row-template">
    <div class="url-row">
      <div class="row-inputs">
        <input type="url" class="url-input" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">
        <button type="button" class="remove-row-btn hidden" aria-label="Remove link">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="preview hidden">
        <div class="preview-frame">
          <img class="preview-thumb" alt="">
        </div>
        <div class="preview-info">
          <p class="preview-title"></p>
          <p class="preview-meta"></p>
        </div>
      </div>
      <p class="preview-loading hidden">Reading metadata&hellip;</p>
    </div>
  </template>

  <template id="queue-item-template">
    <div class="queue-item">
      <svg class="icon queue-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></svg>
      <div class="queue-item-text">
        <p class="queue-item-title"></p>
        <p class="queue-item-status"></p>
      </div>
    </div>
  </template>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
