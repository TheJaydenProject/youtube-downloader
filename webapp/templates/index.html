<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Downloader</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="page">
    <div class="header">
      <div class="logo">🎬</div>
      <h1>Video Downloader</h1>
      <p class="subtitle">Paste a link, pick a folder, and download.</p>
    </div>

    <div class="card">
      <form id="download-form">
        <label class="field-label" for="url-input">Video URL</label>
        <input type="url" id="url-input" placeholder="https://www.youtube.com/watch?v=..." required>

        <label class="field-label">Save to</label>
        <div class="folder-picker">
          <button type="button" id="folder-btn" class="folder-btn">
            <span class="folder-icon">📁</span>
            <span id="folder-label">Default (downloads)</span>
            <span class="chevron">▾</span>
          </button>
          <div id="folder-menu" class="folder-menu hidden">
            <button type="button" class="folder-option" data-folder="">📁 Default (downloads)</button>
            <div id="folder-list"></div>
            <div class="folder-new">
              <input type="text" id="new-folder-input" placeholder="New folder name">
              <button type="button" id="new-folder-btn">Add</button>
            </div>
          </div>
        </div>

        <button type="submit" class="primary-btn">Download</button>
      </form>

      <div id="progress-container" class="hidden">
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <p id="status-text">Starting...</p>
      </div>

      <div id="result" class="hidden">
        <a id="download-link" class="success-btn" href="#">⬇ Save File</a>
      </div>

      <div id="error" class="hidden error-msg"></div>
    </div>
  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
