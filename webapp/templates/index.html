<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Downloader</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="background-paths" aria-hidden="true">
    <svg class="paths-layer" id="paths-1" viewBox="0 0 696 316" preserveAspectRatio="none"></svg>
    <svg class="paths-layer" id="paths-2" viewBox="0 0 696 316" preserveAspectRatio="none"></svg>
  </div>

  <main class="content">
    <h1 class="title" id="title"></h1>

    <div class="card">
      <div class="card-inner">
        <form id="download-form">
          <input type="url" id="url-input" placeholder="Paste a video link..." required>
          <input type="text" id="folder-input" placeholder="Save to folder (optional)">
          <button type="submit">
            <span>Download</span>
            <span class="arrow">→</span>
          </button>
        </form>

        <div id="progress-container" class="hidden">
          <div class="progress-bar">
            <div id="progress-fill" class="progress-fill"></div>
          </div>
          <p id="status-text">Starting...</p>
        </div>

        <div id="result" class="hidden">
          <a id="download-link" class="download-btn" href="#">⬇️ Save File</a>
        </div>

        <div id="error" class="hidden error-msg"></div>
      </div>
    </div>
  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
