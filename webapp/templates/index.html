<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Downloader</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="card">
    <h1>🎬 Video Downloader</h1>
    <p class="subtitle">Paste a video link below and click Download</p>

    <form id="download-form">
      <input type="url" id="url-input" placeholder="https://www.youtube.com/watch?v=..." required>
      <button type="submit">Download</button>
    </form>

    <div id="progress-container" class="hidden">
      <div class="progress-bar">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
      <p id="status-text">Starting...</p>
    </div>

    <div id="result" class="hidden">
      <a id="download-link" class="download-btn" href="#">⬇️ Save File</a>
    </div>

    <div id="error" class="hidden error-msg"></div>
  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
